<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Nikita Yeldynov — Full Stack Developer: Next.js, React, TypeScript, Node.js">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="1" r="0.5">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="320" rx="20"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <rect width="1280" height="320" fill="url(#glow)"/>
    <rect width="1280" height="320" fill="url(#glow2)"/>

    <!-- left: identity -->
    <g class="sans">
      <text x="72" y="92" class="mono" font-size="15" fill="#60A5FA" letter-spacing="2">FULL STACK DEVELOPER</text>
      <text x="70" y="158" font-size="60" font-weight="700" fill="#F9FAFB" letter-spacing="-1.5">Nikita Yeldynov</text>
      <text x="72" y="200" font-size="22" fill="#9CA3AF">Next.js apps for SaaS, e-commerce and education,</text>
      <text x="72" y="230" font-size="22" fill="#9CA3AF">from the database to a pixel-perfect UI.</text>

      <!-- chips -->
      <g font-size="14" class="mono">
        <rect x="72" y="256" width="88" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <text x="116" y="276" text-anchor="middle" fill="#E5E7EB">Next.js</text>
        <rect x="170" y="256" width="78" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <text x="209" y="276" text-anchor="middle" fill="#E5E7EB">React</text>
        <rect x="258" y="256" width="118" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <text x="317" y="276" text-anchor="middle" fill="#E5E7EB">TypeScript</text>
        <rect x="386" y="256" width="92" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <text x="432" y="276" text-anchor="middle" fill="#E5E7EB">Node.js</text>
        <rect x="488" y="256" width="118" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <text x="547" y="276" text-anchor="middle" fill="#E5E7EB">PostgreSQL</text>
      </g>
    </g>

    <!-- right: code window -->
    <g transform="translate(800 56)">
      <rect width="412" height="208" rx="14" fill="#0D1117" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <circle cx="24" cy="22" r="6" fill="#FF5F57"/>
      <circle cx="44" cy="22" r="6" fill="#FEBC2E"/>
      <circle cx="64" cy="22" r="6" fill="#28C840"/>
      <text x="388" y="27" text-anchor="end" class="mono" font-size="12" fill="#6B7280">developer.ts</text>
      <line x1="0" y1="44" x2="412" y2="44" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <g class="mono" font-size="15">
        <text x="24" y="76"><tspan fill="#C084FC">const</tspan><tspan fill="#E5E7EB"> nikita = {</tspan></text>
        <text x="44" y="102"><tspan fill="#93C5FD">role</tspan><tspan fill="#E5E7EB">: </tspan><tspan fill="#86EFAC">"full stack"</tspan><tspan fill="#E5E7EB">,</tspan></text>
        <text x="44" y="128"><tspan fill="#93C5FD">shipped</tspan><tspan fill="#E5E7EB">: </tspan><tspan fill="#86EFAC">"20+ apps"</tspan><tspan fill="#E5E7EB">,</tspan></text>
        <text x="44" y="154"><tspan fill="#93C5FD">upwork</tspan><tspan fill="#E5E7EB">: </tspan><tspan fill="#86EFAC">"Top Rated, 100% JSS"</tspan><tspan fill="#E5E7EB">,</tspan></text>
        <text x="24" y="180" fill="#E5E7EB">};</text>
      </g>
      <rect x="44" y="190" width="9" height="2" fill="#60A5FA"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="19.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
</svg>
