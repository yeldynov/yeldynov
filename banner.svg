<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Nikita Yeldynov, Full Stack Developer: Next.js, React, TypeScript, Node.js">
<defs>
<style>
@font-face{font-family:"GS";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"GS";font-weight:800;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"GM";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
.s{font-family:"GS",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.m{font-family:"GM",ui-monospace,Menlo,Consolas,monospace}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07080C"/><stop offset="1" stop-color="#0B0D14"/></linearGradient>
<linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0.3"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.55" stop-color="#E0E7FF"/><stop offset="1" stop-color="#93C5FD"/></linearGradient>
<linearGradient id="eyebrow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/><stop offset="1" stop-color="#818CF8" stop-opacity="0.35"/></linearGradient>
<linearGradient id="winBorder" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#93C5FD" stop-opacity="0.45"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/><stop offset="1" stop-color="#C084FC" stop-opacity="0.4"/></linearGradient>
<linearGradient id="chipStroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/></linearGradient>
<linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151925" stop-opacity="0.92"/><stop offset="1" stop-color="#0C0E15" stop-opacity="0.92"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.09"/></pattern>
<radialGradient id="fade" cx="0.75" cy="0.35" r="0.65"><stop offset="0" stop-color="#FFF"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="dotMask"><rect width="1280" height="320" fill="url(#fade)"/></mask>
<clipPath id="card"><rect width="1280" height="320" rx="22"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1280" height="320" fill="url(#bg)"/>
<g filter="url(#blur)">
<ellipse cx="1010" cy="40" rx="260" ry="120" fill="#3B82F6" fill-opacity="0.45"/>
<ellipse cx="1200" cy="250" rx="200" ry="110" fill="#8B5CF6" fill-opacity="0.38"/>
<ellipse cx="120" cy="330" rx="260" ry="90" fill="#06B6D4" fill-opacity="0.16"/>
</g>
<rect width="1280" height="320" fill="url(#dots)" mask="url(#dotMask)"/>
<g class="s">
<rect x="72" y="62" width="6" height="6" rx="1" fill="url(#eyebrow)" transform="rotate(45 75 65)"/>
<text x="90" y="70" class="m" font-size="13.5" letter-spacing="3" fill="url(#eyebrow)">FULL STACK DEVELOPER</text>
<text x="68" y="150" font-size="68" font-weight="800" letter-spacing="-2.8" fill="url(#nameGrad)">Nikita Yeldynov</text>
<text x="72" y="196" font-size="21" fill="#A1A1AA" letter-spacing="-0.2">Next.js apps for SaaS, e-commerce and education,</text>
<text x="72" y="226" font-size="21" fill="#A1A1AA" letter-spacing="-0.2">from the database to a pixel-perfect UI.</text>
<rect x="72" y="252" width="89" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="url(#chipStroke)"/><text x="116" y="273" text-anchor="middle" class="m" font-size="14" fill="#E4E4E7">Next.js</text><rect x="170.8" y="252" width="72" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="url(#chipStroke)"/><text x="207" y="273" text-anchor="middle" class="m" font-size="14" fill="#E4E4E7">React</text><rect x="252.8" y="252" width="114" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="url(#chipStroke)"/><text x="310" y="273" text-anchor="middle" class="m" font-size="14" fill="#E4E4E7">TypeScript</text><rect x="376.8" y="252" width="89" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="url(#chipStroke)"/><text x="421" y="273" text-anchor="middle" class="m" font-size="14" fill="#E4E4E7">Node.js</text><rect x="475.6" y="252" width="114" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="url(#chipStroke)"/><text x="533" y="273" text-anchor="middle" class="m" font-size="14" fill="#E4E4E7">PostgreSQL</text>
</g>
<g transform="translate(804 48)" filter="url(#shadow)">
<rect width="404" height="228" rx="16" fill="url(#win)"/>
<rect x="0.5" y="0.5" width="403" height="227" rx="15.5" fill="none" stroke="url(#winBorder)"/>
<circle cx="26" cy="24" r="5.5" fill="#FF5F57"/><circle cx="45" cy="24" r="5.5" fill="#FEBC2E"/><circle cx="64" cy="24" r="5.5" fill="#28C840"/>
<text x="378" y="28" text-anchor="end" class="m" font-size="12" fill="#71717A">developer.ts</text>
<line x1="0" y1="46" x2="404" y2="46" stroke="#FFFFFF" stroke-opacity="0.07"/>
<text x="28" y="86" class="m" font-size="15" xml:space="preserve"><tspan fill="#C4B5FD">const </tspan><tspan fill="#F4F4F5">nikita</tspan><tspan fill="#A1A1AA"> = {</tspan></text><text x="28" y="111" class="m" font-size="15" xml:space="preserve"><tspan fill="#93C5FD">  stack</tspan><tspan fill="#A1A1AA">: [</tspan><tspan fill="#86EFAC">&quot;Next.js&quot;</tspan><tspan fill="#A1A1AA">, </tspan><tspan fill="#86EFAC">&quot;TS&quot;</tspan><tspan fill="#A1A1AA">],</tspan></text><text x="28" y="136" class="m" font-size="15" xml:space="preserve"><tspan fill="#93C5FD">  shipped</tspan><tspan fill="#A1A1AA">: </tspan><tspan fill="#86EFAC">&quot;20+ apps&quot;</tspan><tspan fill="#A1A1AA">,</tspan></text><text x="28" y="161" class="m" font-size="15" xml:space="preserve"><tspan fill="#93C5FD">  upwork</tspan><tspan fill="#A1A1AA">: </tspan><tspan fill="#86EFAC">&quot;Top Rated&quot;</tspan><tspan fill="#A1A1AA">,</tspan></text><text x="28" y="186" class="m" font-size="15" xml:space="preserve"><tspan fill="#93C5FD">  jss</tspan><tspan fill="#A1A1AA">: </tspan><tspan fill="#FDBA74">100</tspan><tspan fill="#A1A1AA">,</tspan></text><text x="28" y="211" class="m" font-size="15" xml:space="preserve"><tspan fill="#A1A1AA">};</tspan></text>
<rect class="cursor" x="48" y="198" width="8" height="16" rx="1" fill="#60A5FA"/>
</g>
</g>
<rect x="0.75" y="0.75" width="1278.5" height="318.5" rx="21.25" fill="none" stroke="url(#border)" stroke-width="1.5"/>
</svg>